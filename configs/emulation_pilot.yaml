schema_version: 1
study: qrc_to_qelm_observable_emulation
status: EXPLORATORY_PILOT
claim_scope: simulator_only_exact_expectations

common:
  n_qubits: 3
  dt: 0.5
  h: 0.5
  h_in: 1.0
  J_s: 1.0
  dissipator: local_loss
  quantize_levels: 33
  n_virtual: 1
  observables:
    axes: [x, y, z]
    max_weight: 2
    dimension: 18
  alpha_grid: [0.0, 1.0e-10, 1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2, 1.0]
  input_distribution: uniform_0_1
  split_policy: independent_reset_streams
  preprocessing: train_only_feature_standardization
  target: full_exact_qrc_observable_vector
  exact_only: true

profiles:
  smoke:
    windows: [1, 3, 8]
    train_rows: 90
    val_rows: 30
    test_rows: 60
    washout: 20
    random_bank_budgets: [1, 2]
    student_coupling_seeds: [915001, 915002]
    paired_histories: 8
    pair_burnin: 12
    pair_branch: 16
    systems:
      - system_id: smoke_g035
        gamma: 0.35
        teacher_coupling_seed: 910001
        train_input_seed: 911001
        val_input_seed: 912001
        test_input_seed: 913001
        pair_seed: 914001

