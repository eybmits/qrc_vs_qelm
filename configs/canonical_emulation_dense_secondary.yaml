    min_target_variance: 1.0e-8
    min_root_successes: 10
    roots_total: 12
    min_spearman: 0.80
    min_g2_live_systems_per_family: 5
    min_window_gain: 0.20
    min_feature_gain: 0.20
    min_best_classical_gain: 0.10
    min_scaling_r_squared: 0.85
    g4_gammas: [2.0, 4.0]
    g5_gamma: 4.0

