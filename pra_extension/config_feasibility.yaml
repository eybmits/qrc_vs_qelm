schema_version: 1
study: pra_generalization_measurement_frontier
profile: feasibility
status: ENGINEERING_ONLY
protocol: PROTOCOL.md
scientific_use: prohibited

teacher:
  n_qubits: [4]
  dt: 0.5
  h: 0.5
  h_in: 1.0
  J_s: 1.0
  target_observables:
    axes: [x, y, z]
    max_weight: 2
    same_axis_only: true
  conditions:
    unitary_baseline:
      dissipator: none
      nominal_gammas: [0.0]
    local_loss:
      dissipator: local_loss
      nominal_gammas: [1.0, 4.0]
    local_dephasing:
      dissipator: dephasing
      nominal_gammas: [1.0, 4.0]
    collective_loss:
      dissipator: collective_loss
      nominal_gammas: [1.0, 4.0]
  rate_normalization:
    metric: sum_rate_trace_LdaggerL_divided_by_N_times_2_to_N_minus_1
    target_equals_nominal_gamma: true
  continuous_propagation:
    quantize_levels: null
    cache_input_propagators: false

student:
  architecture: ptd_parallel
  encoding: one_lag_per_qubit
  n_qubits: 6
  T_evolve: 0.5
  h: 0.5
  J_s: 1.0
  unitary: true
  windows: [1, 3, 6]
  max_snapshots: 4
  snapshot_budgets: [1, 2, 4]
  feature_budgets: [18, 36, 72]
  observables:
    axes: [x, y, z]
    max_weight: 1

input:
  train_validation_test_distribution: uniform_continuous_0_1
  prefix_distribution: uniform_continuous_0_1
  suffix_older_coordinates: uniform_continuous_0_1
  suffix_newest_coordinate: randomized_latin_hypercube_1d
  bit_generator: PCG64DXSM
  hash_float_bit_patterns: true

rows:
  burnin_per_stream: 48
  train: 96
  validation: 32
  test: 64
  suffix_groups: 8
  prefix_branches: 4
  prefix_burnin: 48

fit:
  alpha_grid: [0.0, 1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2, 1.0, 1.0e2, 1.0e4, "+inf"]
  train_only_feature_standardization: true
  resolved_svd_relative_cutoff: 1.0e-6

finite_shots:
  enabled: false
  reason: benchmark_exact_continuous_N4_first

runtime_go_gate:
  max_peak_rss_gib: 8
  max_projected_serial_confirmatory_hours: 4
  max_projected_four_worker_minutes: 90
  max_trace_error: 1.0e-10
  max_hermiticity_error: 1.0e-10
  min_density_eigenvalue: -1.0e-9
  require_duplicate_science_hash_match: true

roots:
  - root_id: pra_feas01
    teacher_coupling_seeds: {"4": 910103}
    student_coupling_seed: 911101
    train_input_seed: 912101
    validation_input_seed: 913101
    test_input_seed: 914101
    suffix_input_seed: 915101
    prefix_input_seed: 916101
    classical_feature_seed: 917101
    student_shot_seed: 918101
    teacher_shot_seed: 919101
